[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flow-cli"
version = "0.1.0"
description = "Command-line client for DJ Agent Platform"
requires-python = ">=3.10"
dependencies = [
    "langsmith>=0.5.1",
    "langchain-core>=1.0",
    "python-dotenv>=1.0",
    "merge3>=0.0.16",
]

[project.scripts]
flow = "cli:main"


[tool.hatch.build.targets.wheel]
include = ["cli.py", "client.py", "compare.py", "langsmith_client.py", "merge.py"]
